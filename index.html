      /* Defines a subtle gradient background for the entire application. */

      /* --- ACCESSIBILITY ENHANCEMENTS --- */
      /* Utility class to visually hide elements while keeping them accessible to screen readers. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }
      /* Style for the "Skip to main content" link, making it visible on focus. */
      .skip-link:focus {
        position: fixed;
        top: 1rem;
        left: 1rem;
        padding: 0.75rem 1.25rem;
        background-color: #161B22;
        color: #22d3ee;
        border: 2px solid #22d3ee;
        border-radius: 0.5rem;
        z-index: 100;
        text-decoration: none;
        font-weight: bold;
      }
      /* Enhanced focus outline for keyboard accessibility. Only shows for keyboard users. */
      *:focus-visible {
        outline: 2px solid #22d3ee; /* brand-accent */
        outline-offset: 2px;
        box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.2);
        border-radius: 2px;
      }

      /* Core styles for rendering the organizational chart tree structure. */
      .org-tree {
        display: inline-block; /* Allows the tree to size based on content. */
        text-align: center;
      }
      /* Styles for the connecting lines and layout of tree nodes. */
      .org-tree ul {
          padding-top: 20px;
          position: relative;
          transition: all 0.5s;
          /* Symmetrical layout using flexbox. */
          display: flex;
          justify-content: center;
      }
      .org-tree li {
          text-align: center;
          list-style-type: none;
          position: relative;
          padding: 20px 5px 0 5px;
          transition: all 0.5s;
      }
      /* The ::before and ::after pseudo-elements are used to draw the connecting lines. */
      .org-tree li::before, .org-tree li::after {
          content: '';
          position: absolute;
          top: 0;
          right: 50%;
          border-top: 2px solid #4b5563; /* gray-600 */
          width: 50%;
          height: 20px;
      }
      .org-tree li::after {
          right: auto;
          left: 50%;
          border-left: 2px solid #4b5563;
      }
      /* Rules to handle nodes with only one child or edge cases like the first/last child. */
      .org-tree li:only-child::after, .org-tree li:only-child::before {
          display: none;
      }
      .org-tree li:only-child {
          padding-top: 0;
      }
      .org-tree li:first-child::before, .org-tree li:last-child::after {
          border: 0 none;
      }
      .org-tree li:last-child::before {
          border-right: 2px solid #4b5563;
          border-radius: 0 5px 0 0;
      }
      .org-tree li:first-child::after {
          border-radius: 5px 0 0 0;
      }
      /* The vertical line coming down from a parent node. */
      .org-tree ul ul::before {
          content: '';
          position: absolute;
          top: 0;
          left: 50%;
          border-left: 2px solid #4b5563;
          width: 0;
          height: 20px;
      }
      .org-tree li > div {
        display: inline-block;
        min-width: 140px;
      }
